<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Antonio"; src: url("assets/fonts/antonio-latin-var.woff2") format("woff2"); font-weight: 500 700; }
      @font-face { font-family: "Archivo"; src: url("assets/fonts/archivo-latin-var.woff2") format("woff2"); font-weight: 400 800; font-stretch: 62% 100%; }
      :root {
        --ground: oklch(94.6% 0.005 250);
        --panel: oklch(98.3% 0.003 250);
        --ink: oklch(19% 0.012 262);
        --muted: oklch(46% 0.01 262);
        --sign: oklch(86.5% 0.165 95);
        --font-display: "Antonio", sans-serif;
        --font-body: "Archivo", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font-body); color: var(--ink); }
      #mark { position: absolute; left: 72px; top: 56px; height: 44px; }
      #label { position: absolute; left: 72px; top: 132px; font-size: 26px; font-weight: 500; }
      #clock { position: absolute; right: 72px; top: 48px; font-family: var(--font-body); font-stretch: 70%; font-weight: 700; font-size: 84px; font-variant-numeric: tabular-nums; line-height: 1; }
      #closed { position: absolute; right: 72px; top: 140px; font-size: 24px; font-weight: 600; opacity: 0; }
      #bars { position: absolute; left: 72px; right: 72px; bottom: 112px; height: 360px; display: flex; align-items: flex-end; gap: 10px; }
      .bar { flex: 1; height: 100%; background: var(--ink); transform-origin: 50% 100%; transform: scaleY(0); border-radius: 2px 2px 0 0; }
      .bar.you { background: var(--sign); box-shadow: inset 0 0 0 3px var(--ink); }
      #base { position: absolute; left: 72px; right: 72px; bottom: 110px; height: 3px; background: var(--ink); }
      #caption { position: absolute; left: 72px; bottom: 48px; font-size: 24px; color: var(--muted); }
      #plate { position: absolute; left: 50%; top: 248px; width: 820px; margin-left: -410px; padding: 26px 36px; background: var(--sign); color: var(--ink); border-radius: 4px; opacity: 0; }
      #plate-head { font-family: var(--font-display); font-weight: 700; font-size: 64px; line-height: 1; text-transform: uppercase; }
      #plate-sub { margin-top: 10px; font-size: 26px; font-weight: 500; font-variant-numeric: tabular-nums; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1280" data-height="720">
      <img id="mark" class="clip" src="assets/bros-wordmark-plate.svg" alt="Bros" data-start="0" data-duration="8" data-track-index="0" />
      <p id="label" class="clip" data-start="0" data-duration="8" data-track-index="1">Example opening window</p>
      <p id="clock" class="clip" data-start="0" data-duration="8" data-track-index="2">01:12</p>
      <p id="closed" class="clip" data-start="0" data-duration="8" data-track-index="3">Window closed</p>
      <div id="bars" class="clip" data-start="0" data-duration="8" data-track-index="4"></div>
      <div id="base" class="clip" data-start="0" data-duration="8" data-track-index="5"></div>
      <p id="caption" class="clip" data-start="0" data-duration="8" data-track-index="6">Each bar is one deposit. Example values.</p>
      <div id="plate" class="clip" data-start="0" data-duration="8" data-track-index="7">
        <p id="plate-head">Same price for everyone</p>
        <p id="plate-sub">Everyone in the window paid 0.0000412 SC</p>
      </div>
    </div>
    <script>
      // Seeded deposit heights (no Math.random: renders must be deterministic).
      const heights = [0.42, 0.78, 0.31, 0.95, 0.56, 0.22, 0.67, 0.88, 0.36, 0.5, 0.74, 0.28, 0.61, 0.99, 0.45, 0.33, 0.81, 0.58, 0.25, 0.7, 0.47, 0.9, 0.38, 0.64];
      const YOU = 9;
      const LEVEL = 0.5;
      const barsEl = document.getElementById('bars');
      heights.forEach((h, i) => {
        const b = document.createElement('div');
        b.className = 'bar' + (i === YOU ? ' you' : '');
        b.id = 'bar-' + i;
        barsEl.appendChild(b);
      });
      const bars = [...barsEl.children];
      const clock = document.getElementById('clock');
      const fmt = s => '0' + Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');

      const tl = gsap.timeline({ paused: true });
      const t = { s: 72 };
      tl.to(t, { s: 0, duration: 3.2, ease: 'none', onUpdate: () => { clock.textContent = fmt(t.s); } }, 0.5);
      bars.forEach((b, i) => {
        tl.to(b, { scaleY: heights[i], duration: 0.45, ease: 'power3.out' }, 0.5 + i * 0.12);
      });
      tl.to('#closed', { opacity: 1, duration: 0.25, ease: 'power2.out' }, 3.75);
      tl.to(bars, { scaleY: LEVEL, duration: 0.8, ease: 'power3.inOut', stagger: 0.012 }, 3.9);
      tl.fromTo('#plate', { y: -40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: 'power3.out' }, 4.75);
      tl.to('#plate', { y: -30, opacity: 0, duration: 0.4, ease: 'power2.in' }, 6.9);
      tl.to('#closed', { opacity: 0, duration: 0.3 }, 6.9);
      tl.to(bars, { scaleY: 0, duration: 0.6, ease: 'power2.in', stagger: 0.01 }, 7.1);
      tl.set(t, { s: 72, onUpdate: () => { clock.textContent = fmt(t.s); } }, 7.9);
      window.__timelines = window.__timelines || {};
      window.__timelines['main'] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
