<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1200, height=630" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Antonio"; src: url("assets/fonts/antonio-latin-var.woff2") format("woff2"); font-weight: 500 700; }
      @font-face { font-family: "Archivo"; src: url("assets/fonts/archivo-latin-var.woff2") format("woff2"); font-weight: 400 800; font-stretch: 62% 100%; }
      :root {
        --ground: oklch(94.6% 0.005 250);
        --ink: oklch(19% 0.012 262);
        --muted: oklch(46% 0.01 262);
        --sign: oklch(86.5% 0.165 95);
        --plate: oklch(19% 0.012 262);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; font-family: "Archivo", sans-serif; color: var(--ink); }
      #mark { position: absolute; left: 64px; top: 52px; height: 40px; }
      #note { position: absolute; right: 64px; top: 60px; font-size: 22px; font-weight: 500; color: var(--muted); }
      #sign { position: absolute; left: 64px; right: 64px; top: 150px; height: 250px; display: flex; align-items: center; gap: 36px; padding: 0 40px; background: var(--plate); border-radius: 4px; opacity: 0; }
      #token { width: 170px; height: 170px; border-radius: 4px; }
      #name-wrap { flex: 1; min-width: 0; }
      #name { font-family: "Antonio", sans-serif; font-weight: 700; font-size: 104px; line-height: 1; color: var(--sign); text-transform: uppercase; white-space: nowrap; }
      #ticker { margin-top: 10px; font-size: 26px; font-weight: 600; color: var(--ground); }
      #counter { width: 210px; padding: 18px 20px 14px; background: var(--sign); color: var(--ink); border-radius: 2px; text-align: center; }
      #digits { position: relative; height: 72px; overflow: hidden; font-stretch: 70%; font-weight: 800; font-size: 72px; line-height: 72px; font-variant-numeric: tabular-nums; }
      .d { position: absolute; left: 0; right: 0; }
      #counter-label { font-size: 22px; font-weight: 600; }
      #caption { position: absolute; left: 64px; top: 432px; font-size: 30px; font-weight: 600; opacity: 0; }
      #footer { position: absolute; left: 64px; right: 64px; bottom: 48px; display: flex; justify-content: space-between; font-size: 22px; color: var(--muted); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1200" data-height="630"
      data-composition-variables='[{"id":"name","type":"string","label":"Token name","default":"Rain Frog"},{"id":"ticker","type":"string","label":"Ticker","default":"RAIN"},{"id":"before","type":"string","label":"People before","default":"18/25"},{"id":"after","type":"string","label":"People after","default":"19/25"}]'>
      <img id="mark" class="clip" src="assets/bros-wordmark-plate.svg" alt="Bros" data-start="0" data-duration="5" data-track-index="0" />
      <p id="note" class="clip" data-start="0" data-duration="5" data-track-index="1">Example data</p>
      <div id="sign" class="clip" data-start="0" data-duration="5" data-track-index="2">
        <img id="token" src="assets/token.webp" alt="" />
        <div id="name-wrap"><p id="name" data-var-text="name">Rain Frog</p><p id="ticker" data-var-text="ticker">RAIN</p></div>
        <div id="counter"><div id="digits"><span id="d-before" class="d" data-var-text="before">18/25</span><span id="d-after" class="d" data-var-text="after">19/25</span></div><p id="counter-label">people</p></div>
      </div>
      <p id="caption" class="clip" data-start="0" data-duration="5" data-track-index="3">It graduates when 25 verified people hold it.</p>
      <div id="footer" class="clip" data-start="0" data-duration="5" data-track-index="4"><span>People graduate tokens, not bots.</span><span>Testnet. Season Credit has no monetary value.</span></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo('#sign', { y: -24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: 'power3.out' }, 0.1);
      tl.fromTo('#d-before', { yPercent: 0 }, { yPercent: -100, duration: 0.18, ease: 'power2.in' }, 1.9);
      tl.fromTo('#d-after', { yPercent: 100 }, { yPercent: 0, duration: 0.22, ease: 'power3.out' }, 1.95);
      tl.fromTo('#caption', { y: 12, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: 'power3.out' }, 2.4);
      window.__timelines = window.__timelines || {};
      window.__timelines['main'] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
